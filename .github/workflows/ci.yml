name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; never cancel a main run. Each merge commit is a
# distinct state that needs its own verdict — on 2026-08-05 two merges landed 14
# seconds apart, and a blanket cancel-in-progress would have left the first one
# permanently unjudged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cascadia_test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Prettier was never gated here, so formatting drifted across 179 files
      # before anyone noticed. `prettier` is pinned to an exact version in
      # package.json — a floating range reformats different files per minor
      # release, which is drift by another name.
      - name: Check formatting
        run: npm run format:check

      # Every file carries the SPDX header its edition requires. This matters
      # because the OSS publish pipeline copies core files downstream verbatim —
      # there is no header-rewriting step, by design — so a wrong header here
      # becomes a wrong licence there.
      - name: Check license headers
        run: npm run license:check

      # Core must not reach proprietary code. Resolves every import specifier
      # and classifies the target, rather than matching patterns: two rounds of
      # grepping previously declared a package "fully seamed" while a dynamic
      # import and a bare package-id string were still live. Ratcheted — the
      # known-pending list may only shrink.
      - name: Check core/proprietary boundary
        run: npm run boundary:check

  openapi:
    name: OpenAPI Snapshot
    # Pushes to `main` only. The snapshot in this repository is written by
    # the release pipeline, not by hand, so regenerating it in a pull request
    # is churn the next release overwrites — and a failing check on a
    # contribution that could not have avoided it. The contract is still
    # enforced on `main`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Regenerates the OpenAPI spec from route metadata and diffs it against
      # the committed snapshot. Fails when a route signature changed without
      # `npm run openapi:snapshot` being committed alongside.
      - name: Verify OpenAPI snapshot is up to date
        run: npm run openapi:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascadia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Setup database schema
        run: npm run db:push

      # `npm run test`, not `test:coverage`: vitest.config.ts enforces no
      # coverage thresholds, and the codecov upload that consumed the report was
      # dropped when this repo went proprietary — it had no token here and would
      # have shipped source paths and per-line coverage of closed code to a third
      # party. Nothing consumed the report, so nothing generates it.
      - name: Run unit tests
        run: npm run test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # PR-only. The pull_request event checks out refs/pull/N/merge — main with
    # this branch already merged — so by the time the merge commit lands on main,
    # E2E has already run against that exact tree. Across the last 10 merges the
    # post-merge run matched its PR run 10 times out of 10, at ~11 of the 22
    # billed runner-minutes per run. That was half the CI bill for a replay.
    #
    # The main run is kept for what a PR run genuinely cannot cover: main
    # advancing after a PR's last green run. GitHub recomputes the merge ref but
    # does not re-run CI, so two independently-passing PRs can break once merged.
    # Lint, Unit Tests, OpenAPI and Build still run on main and catch that class
    # of semantic conflict — E2E is both the least likely to add a verdict there
    # and by far the slowest to deliver one.
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascadia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    # No `needs:` — deliberately. This was `needs: [lint, unit-tests]`, which made
    # the strictest gate in the repo hostage to the weakest: a prettier failure in
    # Lint skipped Build, and `typecheck:strict` with it. Between 2026-07-30 and
    # 2026-08-05 that skipped Build on 15 of 18 runs, and PRs #57 and #58 reached
    # main with no typecheck signal at all — the PR page showed a red X everyone
    # had already filed under "formatting".
    #
    # Building unconditionally costs ~2.5 runner-minutes on runs that would have
    # skipped it. That is the point: when lint is red is precisely when you still
    # want to know whether the types are sound. It also shortens the post-merge
    # run, where Build is otherwise the tail of a lint -> unit -> build chain.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Both editions, because a change can break one and not the other — the
      # community app is not a subset of the enterprise app's build, it is a
      # separate composition with its own route tree.
      - name: Build (enterprise)
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build (community)
        run: npm run build:community
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Deliberately lives in this job, after Build, rather than standing alone:
      # apps/*/src/routeTree.gen.ts is gitignored and generated by
      # TanStackRouterVite during `vite build`. It carries the module
      # augmentation typing every createFileRoute() site, so on a fresh checkout
      # a standalone tsc job would report a number unrelated to the code and
      # gate nothing. Running here reuses the trees the builds just produced —
      # and both must exist, since `typecheck-all` checks each app separately.
      - name: Typecheck
        run: npm run typecheck:strict
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  compose-config:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker compose config` is a no-network, no-daemon-needed YAML/schema
      # validation. Catches drift between docker-compose.demo.yml (image-only
      # quickstart) and docker-compose.demo-with-build.yml (contributor build)
      # before they break end-users pulling the file via curl.
      - name: Validate quickstart compose
        run: docker compose -f docker-compose.demo.yml config --quiet

      - name: Validate contributor compose
        run: docker compose -f docker-compose.demo-with-build.yml config --quiet

  large-files:
    name: Large File Guard
    runs-on: ubuntu-latest
    # PR-only: it needs a base to diff against. Every change reaches main via a
    # PR, so this is sufficient.
    if: github.event_name == 'pull_request'
    steps:
      # Needs real history to enumerate the objects this PR introduces.
      # Cheap now: the packed repo is ~3 MB.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # demo-data/robot-arm/glb was once 95% of this repo's history — 79 GLB
      # files, one of them 62 MB — before it moved to Cascadia-PLM/Demo-Data and
      # the history was rewritten to reclaim it. Nothing structural stops that
      # from happening again, so this does.
      #
      # rev-list --not base enumerates objects the PR *introduces*, which catches
      # a blob that was committed and then deleted again: it no longer appears in
      # any tree, but it is permanently in history all the same.
      - name: Reject new blobs over 5 MB
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LIMIT=$((5 * 1024 * 1024))

          offenders=$(
            git rev-list --objects "$HEAD" --not "$BASE" \
              | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
              | awk -v lim="$LIMIT" '
                  $1 == "blob" && $2 > lim {
                    size = $2; $1 = ""; $2 = ""; sub(/^ +/, "")
                    printf "  %.1f MB  %s\n", size / 1048576, $0
                  }'
          )

          if [ -n "$offenders" ]; then
            echo "::error::This PR introduces blobs larger than 5 MB. Git history is forever."
            echo ""
            echo "$offenders"
            echo ""
            echo "Large binaries do not belong in this repo. Options:"
            echo "  - CAD/demo assets  -> Cascadia-PLM/Demo-Data, fetched via 'npm run demo:fetch'"
            echo "  - build outputs    -> generate them, and add the path to .gitignore"
            echo "  - genuinely needed -> publish as a release asset and download at build time"
            echo ""
            echo "Deleting the file in a later commit does NOT help; the blob stays in history."
            exit 1
          fi

          echo "No blobs over 5 MB introduced."
