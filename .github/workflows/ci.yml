name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cascadia_test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  openapi:
    name: OpenAPI Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Regenerates the OpenAPI spec from route metadata and diffs it against
      # the committed snapshot. Fails the build if a route signature changed
      # without `npm run openapi:snapshot` being committed alongside.
      - name: Verify OpenAPI snapshot is up to date
        run: npm run openapi:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascadia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Setup database schema
        run: npm run db:push

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascadia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Deliberately lives in this job, after Build, rather than standing alone:
      # src/routeTree.gen.ts is gitignored and generated by TanStackRouterVite
      # during `vite build`. It carries the module augmentation typing all 65
      # createFileRoute() sites, so on a fresh checkout a standalone tsc job
      # would report a number unrelated to the ceilings and gate nothing.
      # Running here reuses the route tree the real build just produced.
      - name: Typecheck
        run: npm run typecheck:ci
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  compose-config:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker compose config` is a no-network, no-daemon-needed YAML/schema
      # validation. Catches drift between docker-compose.demo.yml (image-only
      # quickstart) and docker-compose.demo-with-build.yml (contributor build)
      # before they break end-users pulling the file via curl.
      - name: Validate quickstart compose
        run: docker compose -f docker-compose.demo.yml config --quiet

      - name: Validate contributor compose
        run: docker compose -f docker-compose.demo-with-build.yml config --quiet

  large-files:
    name: Large File Guard
    runs-on: ubuntu-latest
    # PR-only: it needs a base to diff against. Every change reaches main via a
    # PR, so this is sufficient.
    if: github.event_name == 'pull_request'
    steps:
      # Needs real history to enumerate the objects this PR introduces.
      # Cheap now: the packed repo is ~3 MB.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # demo-data/robot-arm/glb was once 95% of this repo's history — 79 GLB
      # files, one of them 62 MB — before it moved to Cascadia-PLM/Demo-Data and
      # the history was rewritten to reclaim it. Nothing structural stops that
      # from happening again, so this does.
      #
      # rev-list --not base enumerates objects the PR *introduces*, which catches
      # a blob that was committed and then deleted again: it no longer appears in
      # any tree, but it is permanently in history all the same.
      - name: Reject new blobs over 5 MB
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LIMIT=$((5 * 1024 * 1024))

          offenders=$(
            git rev-list --objects "$HEAD" --not "$BASE" \
              | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
              | awk -v lim="$LIMIT" '
                  $1 == "blob" && $2 > lim {
                    size = $2; $1 = ""; $2 = ""; sub(/^ +/, "")
                    printf "  %.1f MB  %s\n", size / 1048576, $0
                  }'
          )

          if [ -n "$offenders" ]; then
            echo "::error::This PR introduces blobs larger than 5 MB. Git history is forever."
            echo ""
            echo "$offenders"
            echo ""
            echo "Large binaries do not belong in this repo. Options:"
            echo "  - CAD/demo assets  -> Cascadia-PLM/Demo-Data, fetched via 'npm run demo:fetch'"
            echo "  - build outputs    -> generate them, and add the path to .gitignore"
            echo "  - genuinely needed -> publish as a release asset and download at build time"
            echo ""
            echo "Deleting the file in a later commit does NOT help; the blob stays in history."
            exit 1
          fi

          echo "No blobs over 5 MB introduced."
