# Build and publish the images that back the zero-friction demo:
#   ghcr.io/cascadia-plm/cascadia-app
#   ghcr.io/cascadia-plm/cascadia-cad-converter
#   ghcr.io/cascadia-plm/cascadia-jobs-worker
#
# The fourth image, ghcr.io/cascadia-plm/cascadia-demo-data, is built and
# published by Cascadia-PLM/Demo-Data, which owns the dataset.
#
# Images are built SELECTIVELY: the `plan` job diffs the push against its base
# and emits a matrix containing only the images whose inputs actually changed. A
# docs-only or test-only commit builds nothing. Tag pushes and manual dispatches
# always build the full set so a release is coherent.
#
# Each architecture builds on a runner of its OWN arch - nothing is emulated.
# `build` fans out over image x platform and pushes untagged, digest-addressed
# images; `merge` then unites each image's per-arch digests into one multi-arch
# manifest and applies the tags. Previously a single amd64 runner cross-built
# arm64 under QEMU, which made `npm ci` die intermittently with exit 132
# (SIGILL) - a non-deterministic emulation crash. Nothing builds before a merge,
# so a failure of that kind can only ever surface on main.
#
# Triggers:
#   - push to main           -> multi-arch build of changed images, push :latest, :main, :sha-<short>
#   - workflow_dispatch      -> full multi-arch rebuild of every image
#   - tag push v*            -> full rebuild, additionally publish :semver
#
# Deliberately NOT on pull_request. These images are published artefacts, and
# publishing is the only thing that builds them. On a pull request it pushed
# nothing, so the whole job bought one Dockerfile smoke test - and charged every
# contributor a long, opaque image build that could not produce an image. It ran
# on forks too, so the first outside contribution carried a red check its author
# had no way to act on. A broken Dockerfile now surfaces on the push to main that
# merges it, where a maintainer sees it.
#
# NOTE on :sha-<short> tags. Because images build selectively, a given commit SHA
# only tags the images that changed in it. `docker-compose.demo.yml` pins :latest,
# which always resolves (unchanged images keep pointing at their previous digest),
# so this affects only users hand-pinning :sha-<short> across all services.
#
# ONE-TIME SETUP after the first successful run:
#   For each package, flip visibility to public:
#     GitHub -> org Cascadia-PLM -> Packages -> <package> -> Settings ->
#     "Change visibility" -> Public.
#   Without this the curl quickstart fails with `unauthorized` for unauthenticated
#   pulls. The visibility setting persists across future pushes.

name: publish-demo-images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Decide which images need building. Emits a JSON matrix consumed by `publish`.
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      any: ${{ steps.select.outputs.any }}
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      # Default shallow checkout. paths-filter deepens on demand via its
      # initial-fetch-depth (default 100); `fetch-depth: 0` would drag in every
      # historical demo-data blob for no benefit.
      - uses: actions/checkout@v4

      # A filter pattern that matches nothing has stopped protecting anything,
      # and it fails silently: the image simply stops being rebuilt, and the
      # only symptom is a `:latest` that is quietly older than main. That is
      # how `src/**`, `index.html`, `vite.config.ts`, `drizzle.config.ts` and
      # `test-data/**` survived the workspace split here — all five had moved
      # under packages/ or apps/, and nothing said so.
      #
      # Everything up to the first wildcard has to exist. That is enough to
      # catch a path that moved, without pretending to verify a glob.
      - name: Refuse a filter pattern that matches nothing
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-demo-images.yml
          stale=0
          while read -r pattern; do
            base=${pattern%%\**}
            base=${base%/}
            [ -n "$base" ] || continue
            if [ ! -e "$base" ]; then
              echo "::error file=$workflow::paths-filter pattern '$pattern' matches nothing in the tree. It moved or was deleted; update the filters block."
              stale=1
            fi
          done < <(sed -n "/filters: |/,/- name: Select images to build/p" "$workflow" |
                   sed -n "s/^ *- '\(.*\)'\$/\1/p")
          [ "$stale" -eq 0 ]

      # Skipped entirely on tag pushes, workflow_dispatch, and the all-zeros
      # `before` SHA (branch creation / history-rewriting force-push). In those
      # cases `changes` is unset and the next step force-builds everything.
      - name: Detect changed image sources
        id: filter
        if: >-
          github.event_name == 'push'
          && !startsWith(github.ref, 'refs/tags/')
          && github.event.before != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            # Anchor for the sources shared by cascadia-app and cascadia-jobs-worker.
            # Both Dockerfiles `COPY . .` and run the identical `npm run build:app`,
            # so a change to any of these genuinely invalidates both images. It
            # surfaces as its own filter key, which the catalog below has no entry
            # for and drops.
            #
            # `packages/**` and `apps/**` are deliberately whole subtrees rather
            # than a list of the files inside them. This block named `src/**`,
            # `index.html`, `vite.config.ts`, `drizzle.config.ts` and `test-data/**`
            # long after the workspace split moved every one of them under
            # packages/ or apps/, so an ordinary source change matched nothing and
            # rebuilt nothing — `:latest` went stale silently, which is the worst
            # way for a selective build to fail. Whole subtrees also pick up a new
            # package or app for free, instead of waiting to be noticed.
            #
            # The rest is what the runtime stage of docker/app.Dockerfile copies:
            # public/, scripts/, tsconfig.json and tsconfig.base.json. `tests/**`
            # and `docs/**` are absent on purpose — neither reaches the image, and
            # a test-only or docs-only commit should build nothing.
            _app_sources: &app_sources
              - 'packages/**'
              - 'apps/**'
              - 'scripts/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - '.dockerignore'
            # Editing the pipeline itself rebuilds everything, so a change to how
            # images are built is always exercised by the commit that makes it.
            _pipeline: &pipeline
              - '.github/workflows/publish-demo-images.yml'
            app:
              - *app_sources
              - *pipeline
              - 'docker/app.Dockerfile'
            jobs_worker:
              - *app_sources
              - *pipeline
              - 'workers/node/Dockerfile'
            cad_converter:
              - *pipeline
              - 'workers/cad-converter/**'
              - 'workers/py-common/**'

      - name: Select images to build
        id: select
        env:
          # JSON array of matched filter names, e.g. ["_app_sources","app","jobs_worker"].
          # Empty string when the filter step above was skipped.
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail

          # Canonical catalog. `filter` maps each image to its paths-filter key and is
          # stripped before the matrix is emitted. Adding or retiring an image means
          # one row here plus its filter block.
          # `freeDisk` opts an image into reclaiming the runner's preinstalled
          # toolchains first - set it for images whose cold build would otherwise
          # run the runner out of disk.
          catalog='[
            {"name":"cascadia-app","context":".","dockerfile":"docker/app.Dockerfile","target":"production","filter":"app"},
            {"name":"cascadia-jobs-worker","context":".","dockerfile":"workers/node/Dockerfile","target":"production","filter":"jobs_worker"},
            {"name":"cascadia-cad-converter","context":"workers","dockerfile":"workers/cad-converter/Dockerfile","target":"","filter":"cad_converter","freeDisk":true}
          ]'

          if [ -z "${CHANGES}" ]; then
            echo "No change detection ran (tag push, manual dispatch, or no diff base) - building every image."
            images=$(jq -c '[.[] | del(.filter)]' <<<"$catalog")
          else
            # --argjson parses CHANGES as JSON rather than interpolating it into the
            # program, so an unexpected filter name cannot alter the jq expression.
            images=$(jq -c --argjson ch "$CHANGES" \
              '[.[] | select(.filter as $f | $ch | index($f)) | del(.filter)]' \
              <<<"$catalog")
          fi

          # Each platform carries the runner whose ARCHITECTURE MATCHES it. Adding
          # an arch means one row here; never point a row at a foreign-arch runner,
          # which would silently reintroduce QEMU emulation and its SIGILL flake.
          # arm64 hosted runners are free for public repos.
          platforms='[
            {"name":"linux/amd64","runner":"ubuntu-latest","suffix":"amd64"},
            {"name":"linux/arm64","runner":"ubuntu-24.04-arm","suffix":"arm64"}
          ]'
          platforms=$(jq -c . <<<"$platforms")

          count=$(jq 'length' <<<"$images")
          {
            echo "images=$images"
            echo "platforms=$platforms"
            echo "any=$([ "$count" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          echo "Building $count image(s):"
          jq -r '.[].name | "  - " + .' <<<"$images"
          echo "On platform(s):"
          jq -r '.[] | "  - " + .name + " (" + .runner + ")"' <<<"$platforms"

  # ---------------------------------------------------------------------------
  # Build each selected image, once per platform, on that platform's native
  # runner. The result is pushed untagged and addressed only by digest;
  # `merge` below turns each image's digests into a tagged multi-arch manifest.
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    # Short-circuits before matrix expansion; an empty matrix would otherwise error.
    if: needs.plan.outputs.any == 'true'
    runs-on: ${{ matrix.platform.runner }}
    name: build ${{ matrix.image.name }} (${{ matrix.platform.suffix }})
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v4

      # A cold build of cascadia-cad-converter exhausted the runner's disk
      # outright (ENOSPC - hard enough that the runner could not write its own
      # logs, so the exact peak was never captured). It creates a full conda env
      # (pythonocc-core), packs it with conda-pack, unpacks the tarball again,
      # and mode=max caching then exports every intermediate layer.
      # This reclaims ~23GB of preinstalled toolchains, none of which are used to
      # build container images; a fully cold build fits comfortably afterwards.
      # It runs before Buildx so the headroom exists for the whole build.
      - name: Free disk space
        if: matrix.image.freeDisk
        run: |
          set -euo pipefail
          echo "Before:"; df -h / | tail -1
          # Absent paths are fine; -f keeps rm quiet about them.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are applied by `merge`, not here - a per-arch build must not claim
      # a shared tag like :latest, or the two arches would race to own it.
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cascadia-plm/${{ matrix.image.name }}

      - name: Build
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: >-
            type=image,name=ghcr.io/cascadia-plm/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # Scope is per-arch: one cache per image would have the two arches
          # clobbering each other's layers.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}

      # The digest is the only handle on an untagged image. Hand it to `merge`
      # as an empty file named for the digest - the name is the whole payload.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Fan-in: one manifest list per image, tying together the per-arch digests.
  # This is what actually publishes the tags users pull.
  # ---------------------------------------------------------------------------
  merge:
    needs: [plan, build]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    name: merge ${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}

    steps:
      # merge-multiple collapses this image's per-arch artifacts into one dir;
      # the pattern keeps sibling images' digests out of it.
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cascadia-plm/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/cascadia-plm/${{ matrix.image.name }}
        run: |
          set -euo pipefail
          # Word splitting is load-bearing on both substitutions: each expands to
          # a list of args (-t per tag, one ref per digest file in cwd).
          # shellcheck disable=SC2046 # intentional: see above
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE: ghcr.io/cascadia-plm/${{ matrix.image.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
