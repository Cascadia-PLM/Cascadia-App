# Cascadia PLM — Quickstart demo (no clone, no build)
#
# Usage (no repo clone required):
#
#   curl -O https://raw.githubusercontent.com/Cascadia-PLM/Cascadia-App/main/docker-compose.demo.yml
#   docker compose -f docker-compose.demo.yml up -d
#
# Then open http://localhost:3000 and log in with:
#   admin@cascadia.local / Cascadia
#
# First run pulls ~1.2 GB of pre-built images from ghcr.io (2-5 min on a typical
# connection) and seeds the database. Subsequent boots are no-ops — the demo
# seed exits early when it sees the ROBOT-ARM program already exists.
#
# Reset everything (wipes only this stack's volumes):
#
#   docker compose -f docker-compose.demo.yml down -v
#
# Upgrading from a demo stack that booted with `drizzle push` (every version
# of this file before the migration switch): run the reset above first. That
# database has tables but no migration journal, and the app refuses to boot on
# one rather than guess what it contains — see scripts/boot-migrate.ts.
#
# Image pins: every Cascadia image below is `:latest@sha256:<digest>`, and the
# digest is what Docker pulls — the tag is only a label. Nothing updates these
# pins when publish-demo-images rebuilds `:latest`, so bump all four together,
# each to the digest `:latest` resolves to, and run the stack end to end before
# committing (docs/deployment/quickstart-smoke-test.md). A lone stale pin is
# how an app image predating its own boot fix shipped here (#115).
#
# Notes:
#   * Credentials below (Postgres, RabbitMQ, admin login) are hardcoded demo
#     literals, and the app port is published on 127.0.0.1 only, so nothing here
#     is reachable from your LAN. DO NOT reuse this compose file for any
#     deployment past your laptop.
#   * Running the demo on a remote VM? Set DEMO_BIND=0.0.0.0 (the admin
#     credential above is public knowledge — do not do this on an untrusted
#     network).
#   * All volumes are namespaced cascadia_demo_* and the project is named
#     cascadia-demo, so this stack does not conflict with the contributor
#     compose (docker-compose.demo-with-build.yml) or the dev stack.
#   * Working from a clone? Use docker-compose.demo-with-build.yml instead
#     to build images from your working tree.

name: cascadia-demo

services:
  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: cascadia-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cascadia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - cascadia_demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cascadia']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [cascadia-demo]

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: cascadia-demo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cascadia
      RABBITMQ_DEFAULT_PASS: cascadia
    volumes:
      - cascadia_demo_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [cascadia-demo]

  # One-shot init container: copies the bundled demo datasets (~420 MB of
  # GLBs, thumbnails and baked tables) from the cascadia-demo-data image into a
  # named volume the app reads from. The app depends on this completing
  # successfully before booting.
  #
  # Plain `cp -r`, deliberately not `cp -rn`. In this image's BusyBox (1.36),
  # `cp -rn /demo-data/. /out/` copies nothing at all and still exits 0, so the
  # volume stayed empty and the demo seed found no datasets. Overwriting costs
  # a few seconds per `up`, and it is also what lets a newer demo-data image
  # refresh files an older one left.
  demo-data-loader:
    image: ghcr.io/cascadia-plm/cascadia-demo-data:latest@sha256:8d7db0dc53dbe6a161fe03f7f7a0df8e0b116c07f83a80b7db862885da728777
    container_name: cascadia-demo-data-loader
    volumes:
      - cascadia_demo_app_data:/out
    command: sh -c "cp -r /demo-data/. /out/ && echo 'demo data loaded'"
    networks: [cascadia-demo]

  app:
    image: ghcr.io/cascadia-plm/cascadia-app:latest@sha256:0539b882d95812ecd0ff692e87d1aab05596b0ee768422eba95007236f0f2f0f
    container_name: cascadia-demo-app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      demo-data-loader: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      DATABASE_SSL: disable
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cascadia
      BASE_URL: http://localhost:3000
      FILE_STORAGE_PATH: /app/storage/files
      VAULT_TYPE: local
      VAULT_ROOT: /app/vault
      RABBITMQ_URL: amqp://cascadia:cascadia@rabbitmq:5672
      DEMO_DATA_DIR: /app/demo-data
    ports:
      - '${DEMO_BIND:-127.0.0.1}:${DEMO_APP_PORT:-3000}:3000'
    volumes:
      - cascadia_demo_app_storage:/app/storage
      - cascadia_demo_app_vault:/app/vault
      - cascadia_demo_app_data:/app/demo-data:ro
    # First boot (migrations + minimal seed + demo seed with vault ingest)
    # takes 60-120s before the HTTP server starts on a slow host. Override the
    # Dockerfile HEALTHCHECK's start_period accordingly.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 180s
    networks: [cascadia-demo]
    # First boot: migrate → minimal seed → demo seed → serve.
    # All steps are idempotent so reboots are safe.
    #
    # Migrations, not `drizzle.mjs push --force`, for the same reason as
    # docker-compose.yml. Push re-diffs the live database on every boot, and
    # drizzle-kit reads composite unique constraints back with their columns in
    # a different order than the schema declares (10 of 19 here). So once the
    # demo seed has put rows in those tables, every later boot wants to drop and
    # re-add them, stops to ask whether to truncate the table — a prompt
    # `--force` does not answer — and dies without a TTY: the first boot works,
    # and every boot after the demo seed loops. boot-migrate.ts applies the
    # committed SQL instead, and is a no-op once the journal is current.
    command: >
      sh -c "tsx scripts/boot-migrate.ts
      && tsx scripts/seed-minimal.ts
      && tsx scripts/seed-demo.ts
      && npm run serve"

  cad-converter:
    image: ghcr.io/cascadia-plm/cascadia-cad-converter:latest@sha256:17a3ec33f4cdbd4b55d0c40b8c0f65d48ae92e957ed45c869fca72ee9cc1a4da
    container_name: cascadia-demo-cad-converter
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cascadia
      RABBITMQ_URL: amqp://cascadia:cascadia@rabbitmq:5672
      VAULT_ROOT: /vault
      WORKER_CONCURRENCY: 2
      HEALTH_PORT: 3003
    volumes:
      # Share the app's vault volume so the converter can read user uploads
      # and write STL/GLB outputs back to the same store the app sees.
      - cascadia_demo_app_vault:/vault
    networks: [cascadia-demo]

  jobs-worker:
    image: ghcr.io/cascadia-plm/cascadia-jobs-worker:latest@sha256:37f08364bbb68ac1fafd865f463a4f41b6118895dde91537d9b3c3812af51c4e
    container_name: cascadia-demo-jobs-worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_SSL: disable
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cascadia
      RABBITMQ_URL: amqp://cascadia:cascadia@rabbitmq:5672
      WORKER_CONCURRENCY: 5
      JOB_TYPES: '*'
      JOB_TIMEOUT: 300000
      # Signing key for webhook deliveries. Empty here because the demo stack
      # ships no subscriptions; the pump refuses to start rather than sending
      # unsigned if one is ever added without setting this.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    networks: [cascadia-demo]

volumes:
  cascadia_demo_postgres_data:
  cascadia_demo_rabbitmq_data:
  cascadia_demo_app_storage:
  cascadia_demo_app_vault:
  cascadia_demo_app_data:

networks:
  cascadia-demo:
    driver: bridge
