name: cad-generator
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - cadquery>=2.4
  - git
  - pip
  - pip:
      - pika>=1.3
      - 'psycopg[binary]>=3.1'
      - pydantic>=2.0
      - pydantic-settings>=2.0
      - pytest>=7.0
      # Pinned to a commit rather than a branch head: an unpinned git dependency
      # re-resolves on every image build, so its licence can change without
      # anyone reviewing it. Apache-2.0 at this commit.
      - git+https://github.com/meadiode/cq_gears.git@e73874cf17a25447a99b1e7c22a4d5af38560e9c
