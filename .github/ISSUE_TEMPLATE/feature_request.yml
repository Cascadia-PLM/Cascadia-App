name: Feature Request
description: Suggest an idea or improvement for Cascadia PLM.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The strongest feature requests describe a problem — the solution is something we can work out together.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem you're trying to solve, not just the solution. Who hits this, and what does it cost them today?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: If you have a solution in mind, sketch it here. Leaving this blank is fine — the problem is the important part.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or ruled out.
    validations:
      required: false
  - type: textarea
    id: code-first-fit
    attributes:
      label: Fit with the code-first philosophy
      description: Cascadia keeps customization in code (TypeScript, Git, pull requests), not UI configuration. Note how the feature fits that — for example, what would be configured in code vs. managed through the UI.
    validations:
      required: false
