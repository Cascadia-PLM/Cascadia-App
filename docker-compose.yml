services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: cascadia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cascadia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default, deliberately: a compose stack that silently comes up as
      # postgres/postgres on a public interface is how databases end up on
      # Shodan. Set it in .env (see .env.docker.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.docker.example}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Loopback only: containers reach postgres over cascadia-network; this
      # mapping exists for host-side psql/tools. Remove it entirely if you
      # don't need host access, or override the bind to expose it deliberately.
      - '${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cascadia}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cascadia-network

  # Cascadia Application
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: production
    container_name: cascadia-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cascadia}
      # The bundled postgres image does not advertise TLS and is only reachable
      # on the private cascadia-network. Override to "require" if you put a
      # TLS-terminating proxy in front or swap in a managed Postgres.
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/app/storage/files}
      VAULT_ROOT: ${VAULT_ROOT:-/app/vault}
      VAULT_TYPE: ${VAULT_TYPE:-local}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cascadia}:${RABBITMQ_PASSWORD:-cascadia}@rabbitmq:5672/${RABBITMQ_VHOST:-}
      # AES-256-GCM key (64 hex chars) for encrypting admin-entered provider
      # API keys at rest. Unset, those keys are stored in plaintext in the
      # database. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - app_storage:/app/storage
      - app_vault:/app/vault
    networks:
      - cascadia-network
    # Migrations, not `push --force`. Push asks drizzle to make the live
    # database look like the schema by whatever DDL that takes, unattended,
    # with --force answering the destructive prompts; migrations apply
    # committed, reviewed SQL and record what they applied.
    #
    # boot-migrate.ts is the guard around it, because a database created
    # before v0.5 has tables and no journal — migrating one would replay the
    # baseline over live data. It refuses to start those and names the one
    # command that fixes them. See scripts/boot-migrate.ts and
    # docs/deployment/upgrading.md.
    #
    # In the app service rather than a one-shot: this file runs a single
    # replica with restart: unless-stopped, and the journal makes migrate a
    # no-op on every boot after the first, so a separate service would
    # duplicate the whole image/env block for no concurrency this stack can
    # have.
    command: sh -c "npx tsx scripts/boot-migrate.ts && npm run serve"

  # RabbitMQ for background jobs
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cascadia-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cascadia}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cascadia}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      # Loopback only: the app and workers reach RabbitMQ over
      # cascadia-network. SECURITY.md says not to expose the management UI
      # publicly — the shipped default now agrees. Override the binds to
      # expose deliberately.
      - '${RABBITMQ_BIND:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672' # AMQP
      - '${RABBITMQ_BIND:-127.0.0.1}:${RABBITMQ_MGMT_PORT:-15672}:15672' # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - cascadia-network

  # Jobs Worker (development mode - mounts source for live reload)
  # NOTE: Uses host.docker.internal for database when postgres runs on host machine
  jobs-worker-dev:
    image: node:22-alpine
    container_name: cascadia-jobs-worker-dev
    restart: unless-stopped
    profiles:
      - dev
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # Use host.docker.internal when postgres runs on Windows host, or postgres when using docker compose postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:5432/${POSTGRES_DB:-cascadia}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cascadia}:${RABBITMQ_PASSWORD:-cascadia}@cascadia-rabbitmq:5672
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      JOB_TYPES: ${JOB_TYPES:-*}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-300000}
    volumes:
      - .:/app
      - /app/node_modules # Use container's node_modules
    working_dir: /app
    networks:
      - cascadia-network
    # `src/jobs-worker.ts` has not existed since the Phase 2 split — the worker
    # lives in the app (`apps/<app>/src/`) because it registers the same modules
    # the server does. scripts/workers.mjs already resolves that path for the
    # npm scripts; this service was the one call site still naming the old one.
    command: sh -c "npm install && npm run jobs:worker:dev"

  # CAD Converter Worker (Python - pythonocc-core for STEP/IGES → STL)
  cad-converter-dev:
    build:
      # Context is ./workers so the image can carry the shared py-common
      # package alongside the worker's own source (JOBS-8).
      context: ./workers
      dockerfile: cad-converter/Dockerfile
    container_name: cascadia-cad-converter-dev
    restart: unless-stopped
    profiles:
      - dev
      - cad
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:5432/${POSTGRES_DB:-cascadia}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cascadia}:${RABBITMQ_PASSWORD:-cascadia}@cascadia-rabbitmq:5672
      VAULT_ROOT: /vault
      WORKER_CONCURRENCY: 2
      HEALTH_PORT: 3003
    volumes:
      - ./vault:/vault
    ports:
      - '3003:3003'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:3003/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - cascadia-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cascadia-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cascadia.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env — see .env.docker.example}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '${PGADMIN_BIND:-127.0.0.1}:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - cascadia-network

volumes:
  postgres_data:
    driver: local
  app_storage:
    driver: local
  app_vault:
    driver: local
  pgadmin_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  cascadia-network:
    driver: bridge
